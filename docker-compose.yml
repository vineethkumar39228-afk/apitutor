version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apitutor_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - apitutor_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apitutor_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/apitutor
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - apitutor_network

  mongo:
    image: mongo:latest
    container_name: apitutor_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apitutor_network

  redis:
    image: redis:alpine
    container_name: apitutor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apitutor_network

networks:
  apitutor_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
